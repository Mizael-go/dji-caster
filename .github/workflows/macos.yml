name: Paquet macOS

# Wails ne peut pas compiler pour macOS depuis Linux (SDK + frameworks Apple) :
# ce workflow construit l'archive universelle sur un runner macOS et la publie
# comme asset de release, téléchargeable sans authentification par la landing.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/macos.yml"
      - "app.go"
      - "main.go"
      - "internal/**"
      - "frontend/**"
      - "build/appicon.png"
      - "wails.json"
      - "go.mod"
      - "go.sum"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Compiler l'app (universal Intel + Apple Silicon)
        run: wails build -platform darwin/universal -clean

      - name: Empaqueter
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "build/bin/dji-caster.app" \
            "dist/dji-caster-macos-universal.zip"

      - name: Publier sur la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-latest
          name: "DJI Caster — macOS (dernière version)"
          body: |
            Archive universelle (Intel + Apple Silicon).

            Application non signée : après extraction, faites un clic droit sur
            `dji-caster.app` → **Ouvrir** (ou Réglages Système → Confidentialité
            et sécurité → Ouvrir quand même).
          prerelease: true
          files: dist/dji-caster-macos-universal.zip
