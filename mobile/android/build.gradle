// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Force build-tools 35 pour tous les modules (app, capacitor-android,
// capacitor-cordova-android-plugins). Sans cela, Gradle tente d'installer
// build-tools 34 à chaque build dans le conteneur jetable, ce qui ajoute
// plusieurs minutes de téléchargement.
subprojects {
    afterEvaluate { project ->
        if (project.extensions.findByName('android') != null) {
            project.android.buildToolsVersion = '35.0.0'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
